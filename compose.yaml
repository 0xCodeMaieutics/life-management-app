services:
  db:
    image: postgres:17
    ports:
      - 5441:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "postgres", "-U", "postgres"]
      timeout: 45s
      interval: 2s
      retries: 50
    volumes:
      - pgdata:/var/lib/postgresql/data

  seaweedfs:
    image: chrislusf/seaweedfs
    ports:
      - 9001:8333
    environment:
      AWS_ACCESS_KEY_ID: access_key
      AWS_SECRET_ACCESS_KEY: access_secret_keys

  app:
    profiles: [prod]
    build: .
    ports:
      - 3001:3001
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/prod.db
      S3_ENDPOINT: http://seaweedfs:8333
    volumes:
      - ${HOME}/Library/Application Support/life-management:/app/data
    depends_on:
      - seaweedfs
    restart: unless-stopped

volumes:
  pgdata:
